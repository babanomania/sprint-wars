<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Sprint Wars — enterprise software delivery simulator">
  <!-- ============================== Defs ============================== -->
  <defs>
    <!-- Dark base gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#11141b"/>
    </linearGradient>

    <!-- Logo gradient -->
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8df7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5e9f0"/>
      <stop offset="60%" stop-color="#e5e9f0"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Soft radial glow -->
    <radialGradient id="glow" cx="0.25" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#4f8df7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0"/>
    </radialGradient>

    <!-- Sparkline gradient -->
    <linearGradient id="velFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8df7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f8df7" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252b38" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ============================== Background ============================== -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- ============================== Logo + Wordmark (left side) ============================== -->
  <g transform="translate(72, 130)">
    <!-- Logo square -->
    <rect width="92" height="92" rx="18" fill="url(#logo)"/>
    <text x="46" y="62" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">SW</text>

    <!-- Wordmark + version chip -->
    <g transform="translate(112, 8)">
      <text x="0" y="40" fill="url(#wordmark)" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-2">SPRINT WARS</text>
      <g transform="translate(0, 56)">
        <text x="0" y="14" fill="#9aa3b2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="3">v1.0</text>
        <rect x="42" y="0" width="50" height="20" rx="4" fill="#ffc857" fill-opacity="0.18"/>
        <text x="67" y="14" text-anchor="middle" fill="#ffc857" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">BETA</text>
      </g>
    </g>

    <!-- Tagline -->
    <text x="0" y="148" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500">Ship the sprint.</text>
    <text x="0" y="180" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500">Survive the year.</text>
    <text x="0" y="212" fill="#9aa3b2" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400">Don't get walked out by HR.</text>

    <!-- Feature chips -->
    <g transform="translate(0, 244)" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      <g>
        <rect x="0" y="0" width="124" height="22" rx="11" fill="#4f8df7" fill-opacity="0.18"/>
        <text x="62" y="15" text-anchor="middle" fill="#4f8df7">INBOX-DRIVEN</text>
      </g>
      <g transform="translate(132, 0)">
        <rect x="0" y="0" width="148" height="22" rx="11" fill="#ff5d6c" fill-opacity="0.18"/>
        <text x="74" y="15" text-anchor="middle" fill="#ff5d6c">INCIDENT COMMAND</text>
      </g>
      <g transform="translate(288, 0)">
        <rect x="0" y="0" width="118" height="22" rx="11" fill="#a78bfa" fill-opacity="0.18"/>
        <text x="59" y="15" text-anchor="middle" fill="#a78bfa">5 STORY ARCS</text>
      </g>
    </g>
  </g>

  <!-- ============================== Game UI mockup (right side) ============================== -->
  <g transform="translate(720, 60)">
    <!-- Dashboard panel -->
    <g>
      <rect width="420" height="320" rx="14" fill="#11141b" stroke="#252b38" stroke-width="1.5"/>
      <!-- Window chrome -->
      <rect width="420" height="34" rx="14" fill="#161a23"/>
      <rect y="20" width="420" height="14" fill="#161a23"/>
      <circle cx="18" cy="17" r="4.5" fill="#ff5d6c" fill-opacity="0.7"/>
      <circle cx="34" cy="17" r="4.5" fill="#ffc857" fill-opacity="0.7"/>
      <circle cx="50" cy="17" r="4.5" fill="#3ddc97" fill-opacity="0.7"/>
      <text x="68" y="21" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="2">SPRINT-WARS · EM CONSOLE</text>
      <line x1="0" y1="34" x2="420" y2="34" stroke="#252b38"/>

      <!-- Top stats row -->
      <text x="20" y="58" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2">SPRINT 4 · DAY 3</text>
      <g transform="translate(330, 50)">
        <circle cx="0" cy="6" r="3" fill="#3ddc97"/>
        <text x="8" y="9" fill="#3ddc97" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2">CONNECTED</text>
      </g>

      <!-- Three stat tiles -->
      <g transform="translate(20, 70)">
        <rect width="120" height="50" rx="6" fill="#161a23"/>
        <text x="10" y="20" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="1.5">VELOCITY</text>
        <text x="10" y="42" fill="#4f8df7" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800">12</text>
      </g>
      <g transform="translate(150, 70)">
        <rect width="120" height="50" rx="6" fill="#161a23"/>
        <text x="10" y="20" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="1.5">MORALE</text>
        <text x="10" y="42" fill="#3ddc97" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800">68</text>
      </g>
      <g transform="translate(280, 70)">
        <rect width="120" height="50" rx="6" fill="#161a23"/>
        <text x="10" y="20" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="1.5">TECH DEBT</text>
        <text x="10" y="42" fill="#ffc857" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800">42%</text>
      </g>

      <!-- Sparkline -->
      <g transform="translate(20, 138)">
        <rect width="380" height="60" rx="6" fill="#161a23"/>
        <text x="12" y="18" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="1.5">VELOCITY TREND</text>
        <g transform="translate(12, 22)">
          <polyline points="0,28 35,22 70,26 105,18 140,20 175,12 210,16 245,8 280,14 315,6 356,10" fill="none" stroke="#4f8df7" stroke-width="1.8" stroke-linejoin="round"/>
          <polygon points="0,28 35,22 70,26 105,18 140,20 175,12 210,16 245,8 280,14 315,6 356,10 356,38 0,38" fill="url(#velFill)"/>
        </g>
      </g>

      <!-- Mini kanban -->
      <g transform="translate(20, 210)">
        <!-- Backlog -->
        <g>
          <rect width="120" height="92" rx="6" fill="#161a23"/>
          <text x="10" y="16" fill="#9aa3b2" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">BACKLOG</text>
          <text x="105" y="16" text-anchor="end" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600">6</text>
          <g transform="translate(8, 22)">
            <rect width="104" height="28" rx="4" fill="#11141b" stroke="#252b38" stroke-width="0.5"/>
            <circle cx="10" cy="14" r="2" fill="#ffc857"/>
            <text x="18" y="17" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500">OAuth flow</text>
          </g>
          <g transform="translate(8, 56)">
            <rect width="104" height="28" rx="4" fill="#11141b" stroke="#252b38" stroke-width="0.5"/>
            <circle cx="10" cy="14" r="2" fill="#4f8df7"/>
            <text x="18" y="17" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500">CSV export</text>
          </g>
        </g>
        <!-- In progress -->
        <g transform="translate(130, 0)">
          <rect width="120" height="92" rx="6" fill="#161a23"/>
          <text x="10" y="16" fill="#4f8df7" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">IN PROGRESS</text>
          <text x="105" y="16" text-anchor="end" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600">3</text>
          <g transform="translate(8, 22)">
            <rect width="104" height="28" rx="4" fill="#11141b" stroke="#252b38" stroke-width="0.5"/>
            <circle cx="10" cy="14" r="2" fill="#ff5d6c"/>
            <text x="18" y="14" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500">Billing bug</text>
            <rect x="18" y="18" width="44" height="8" rx="2" fill="#ff5d6c" fill-opacity="0.18"/>
            <text x="40" y="24" text-anchor="middle" fill="#ff5d6c" font-family="Inter, system-ui, sans-serif" font-size="6" font-weight="700">RUSHED</text>
          </g>
          <g transform="translate(8, 56)">
            <rect width="104" height="28" rx="4" fill="#11141b" stroke="#252b38" stroke-width="0.5"/>
            <circle cx="10" cy="14" r="2" fill="#ffc857"/>
            <text x="18" y="17" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500">Audit log</text>
          </g>
        </g>
        <!-- QA -->
        <g transform="translate(260, 0)">
          <rect width="120" height="92" rx="6" fill="#161a23"/>
          <text x="10" y="16" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">QA</text>
          <text x="105" y="16" text-anchor="end" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600">2</text>
          <g transform="translate(8, 22)">
            <rect width="104" height="28" rx="4" fill="#11141b" stroke="#252b38" stroke-width="0.5"/>
            <circle cx="10" cy="14" r="2" fill="#3ddc97"/>
            <text x="18" y="17" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500">SSO retest</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Floating SEV1 incident toast -->
    <g transform="translate(-30, 230) rotate(-6 100 40)">
      <rect width="200" height="74" rx="8" fill="#11141b" stroke="#252b38" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="74" fill="#ff5d6c"/>
      <g transform="translate(12, 12)">
        <rect width="32" height="14" rx="3" fill="#ff5d6c"/>
        <text x="16" y="10" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1">SEV1</text>
        <text x="40" y="10" fill="#6b7280" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500">INC-1042</text>
      </g>
      <text x="12" y="44" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Checkout 5xx — global</text>
      <text x="12" y="62" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="9">7 min · 4 pages · est. $25,000</text>
    </g>

    <!-- Floating panic email -->
    <g transform="translate(220, 330) rotate(4 110 50)">
      <rect width="240" height="100" rx="8" fill="#11141b" stroke="#252b38" stroke-width="1"/>
      <g transform="translate(12, 12)">
        <circle cx="14" cy="14" r="14" fill="url(#logo)"/>
        <text x="14" y="18" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">DS</text>
        <text x="36" y="12" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Diane Sterling (CEO)</text>
        <text x="36" y="24" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="8">just now · to: you</text>
        <rect x="170" y="2" width="50" height="14" rx="3" fill="#ffc857" fill-opacity="0.18"/>
        <text x="195" y="12" text-anchor="middle" fill="#ffc857" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1">URGENT</text>
      </g>
      <text x="12" y="58" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Re: AI integration — must</text>
      <text x="12" y="71" fill="#e5e9f0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">ship by Friday</text>
      <g transform="translate(12, 80)" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600">
        <rect x="0" y="0" width="46" height="13" rx="3" fill="#ff5d6c" fill-opacity="0.18"/>
        <text x="23" y="9" text-anchor="middle" fill="#ff5d6c">+12 debt</text>
        <rect x="50" y="0" width="56" height="13" rx="3" fill="#ff5d6c" fill-opacity="0.18"/>
        <text x="78" y="9" text-anchor="middle" fill="#ff5d6c">+8 burnout</text>
        <rect x="110" y="0" width="44" height="13" rx="3" fill="#3ddc97" fill-opacity="0.18"/>
        <text x="132" y="9" text-anchor="middle" fill="#3ddc97">+8 trust</text>
      </g>
    </g>
  </g>

  <!-- ============================== Footer chip ============================== -->
  <g transform="translate(72, 432)">
    <text fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2">REACT · TYPESCRIPT · ZUSTAND · TAILWIND · 100% CLIENT-SIDE</text>
  </g>
</svg>
