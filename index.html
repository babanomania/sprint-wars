<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f9" media="(prefers-color-scheme: light)" />

    <title>Sprint Wars — A 12-sprint browser game about agile.</title>
    <meta name="description" content="A 12-sprint browser game about agile. Coping mechanisms included.. 12 sprints, 6 engineers, 5 story arcs, SEV1s at 2am. Ship the sprint. Survive the year." />

    <!-- ── Open Graph (Facebook, WhatsApp, iMessage, Slack, LinkedIn) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://babanomania.github.io/sprint-wars/" />
    <meta property="og:title" content="A 12-sprint browser game about agile. Coping mechanisms included." />
    <meta property="og:description" content="Ship the sprint. Survive the year. Don't get walked out by HR. 12 sprints, 6 engineers, 5 story arcs, SEV1s at 2am. Plays in your browser." />
    <meta property="og:image" content="https://babanomania.github.io/sprint-wars/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sprint Wars — A 12-sprint browser game about agile. Coping mechanisms included." />
    <meta property="og:site_name" content="Sprint Wars" />

    <!-- ── Twitter / X cards ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A 12-sprint browser game about agile. Coping mechanisms included." />
    <meta name="twitter:description" content="Ship the sprint. Survive the year. Don't get walked out by HR. 12 sprints, 6 engineers, SEV1s at 2am. Plays in your browser." />
    <meta name="twitter:image" content="https://babanomania.github.io/sprint-wars/og-image.png" />
    <meta name="twitter:image:alt" content="Sprint Wars — A 12-sprint browser game about agile. Coping mechanisms included." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Boot theme before paint to avoid flash
      try {
        const saved = localStorage.getItem('sw-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
